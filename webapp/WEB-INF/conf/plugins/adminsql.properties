#############################################################################
# Configuration file of Lutece Adminsql

#############################################################################
# Type database list
adminsql.type.database.list = mysql,postgresql

#############################################################################
# Type database command list
adminsql.mysql.command = mysqldump
adminsql.postgresql.command = pg_dump
#############################################################################
# Rows per page of the data of a table
adminsql.paginator.rows.itemsPerPage=50
